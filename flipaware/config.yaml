project:
  name: FlipAware
  hf_user: AmareshHebbar
  github: amareshhebbar/flipaware
  collection_title: FlipAware Embeddings
  collection_description: Embedders fine tuned to separate sentences that look alike but mean different things, plus the data, benchmarks, and leaderboard.

trap_types:
  negation: Add or remove a negation so the meaning flips, for example is and is not, can and cannot, always and never.
  numbers: Change one number, amount, date, or unit so the stated fact becomes different.
  role_swap: Swap who does what to whom while reusing the same words, for example the dog bit the man and the man bit the dog.
  time_order: Reverse the order of two events, or change before into after.
  quantifier: Change a quantifier so the claim covers a different amount, for example some, all, none, most, few.
  hedge: Change how certain the claim is, for example might and will, possibly and definitely, rarely and always.
  entity_swap: Replace one specific person, place, organization, or object with a different one of the same kind.
  scope: Move a modifier or negation so it applies to a different part of the sentence, for example only A did B and A did only B.

trap_examples:
  negation: ["The bridge is safe for heavy trucks.", "The bridge is safe for large trucks.", "The bridge is not safe for heavy trucks."]
  numbers: ["The museum opens at 9 in the morning.", "The museum's doors open at 9 a.m.", "The museum opens at 11 in the morning."]
  role_swap: ["The teacher praised the student.", "The student was praised by the teacher.", "The student praised the teacher."]
  time_order: ["She graduated before she moved to Berlin.", "She finished her degree and then moved to Berlin.", "She graduated after she moved to Berlin."]
  quantifier: ["Some of the samples were contaminated.", "A few of the samples were contaminated.", "All of the samples were contaminated."]
  hedge: ["The update might fix the battery issue.", "The update may solve the battery issue.", "The update will fix the battery issue."]
  entity_swap: ["The treaty was signed in Paris.", "Paris is where the treaty was signed.", "The treaty was signed in Vienna."]
  scope: ["Only the manager approved the budget.", "The budget was approved by the manager alone.", "The manager approved only the budget."]

