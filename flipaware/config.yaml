variants:
  full_guard: {lora: false, guard: true}
  full_noguard: {lora: false, guard: false}
  lora_guard: {lora: true, guard: true}
  lora_noguard: {lora: true, guard: false}

headline_variant: full_guard

train:
  lr_full: 2.0e-5
  lr_lora: 1.0e-4
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  guard_weight: 1.0
  warmup_ratio: 0.1
  weight_decay: 0.01
  matryoshka_dims: [1024, 768, 512, 256, 128, 64]

filter:
  entail_min: 0.7
  equiv_max: 0.5
  trap_overlap_min: 0.5