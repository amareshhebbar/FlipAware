project:
  name: FlipAware
  hf_user: AmareshHebbar
  github: amareshhebbar/flipaware
  collection_title: FlipAware Embeddings
  collection_description: Embedders fine tuned to separate sentences that look alike but mean different things.

trap_types:
  negation: Add or remove a negation so the meaning flips, for example is and is not, can and cannot, always and never.
  numbers: Change one number, amount, date, or unit so the stated fact becomes different.
  role_swap: Swap who does what to whom while reusing the same words, for example the dog bit the man and the man bit the dog.
  time_order: Reverse the order of two events, or change before into after.
  quantifier: Change a quantifier so the claim covers a different amount, for example some, all, none, most, few.
  hedge: Change how certain the claim is, for example might and will, possibly and definitely, rarely and always.
  entity_swap: Replace one specific person, place, organization, or object with a different one of the same kind.
  scope: Move a modifier or negation so it applies to a different part of the sentence, for example only A did B and A did only B.

profiles:
  small:
    seed_pool: 4000
    seeds_per_type: 40
    target_per_type: null
    generator: Qwen/Qwen3-1.7B
    gen_backend: transformers
    gen_batch: 32
    nli_model: cross-encoder/nli-deberta-v3-base
    handcheck: 40
    retrieval_pairs: 2000
    guard_pairs: 1000
    models: [minilm_l6]
    ablation_models: [minilm_l6]
    seeds: [0]
    epochs: 1
    batch_size: 32
    mini_batch: 16
    max_seq_len: 128
    eval_seq_len: 256
    dev_max: 300
    eval_steps: 25
    nanobeir: [scifact, nfcorpus, fiqa2018]
    repo_suffix: _smoke
    private: true
    collect_all: true
    verdict:
      min_trap_gain: 0.0
      max_ndcg_drop: 0.05
      private_if_bad: false
  full:
    seed_pool: 40000
    seeds_per_type: 3600
    target_per_type: 2500
    generator: Qwen/Qwen3-8B
    gen_backend: auto
    gen_batch: 2048
    nli_model: cross-encoder/nli-deberta-v3-large
    handcheck: 500
    retrieval_pairs: 20000
    guard_pairs: 8000
    models: [minilm_l6, bge_small, bge_base, e5_base, arctic_m, gte_modernbert, nomic_modernbert, granite_r2, embeddinggemma_300m, embeddinggemma_2, mxbai_large, qwen3_emb_06b]
    ablation_models: [bge_base, qwen3_emb_06b]
    seeds: [0, 1, 2]
    epochs: 2
    batch_size: 128
    mini_batch: 32
    max_seq_len: 256
    eval_seq_len: 512
    dev_max: 2000
    eval_steps: 50
    nanobeir: [arguana, climatefever, dbpedia, fever, fiqa2018, hotpotqa, msmarco, nfcorpus, nq, quoraretrieval, scidocs, scifact, touche2020]
    repo_suffix: ""
    private: false
    collect_all: false
    verdict:
      min_trap_gain: 0.05
      max_ndcg_drop: 0.01
      private_if_bad: true

